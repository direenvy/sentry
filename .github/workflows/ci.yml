name: ci
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m sentry.generate
      - run: python -m sentry.report
      - run: pytest -q
      - name: data and results are committed and current
        run: git diff --stat -- data results frontend/data && git diff --exit-code -- data results frontend/data
